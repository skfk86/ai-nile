name: Build AI Nile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install packages
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      # ── أيقونة التطبيق ────────────────────────────────────────
      - name: Generate app icons
        run: |
          sudo apt-get install -y imagemagick

          # توليد جميع أحجام PNG
          declare -A sizes=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )
          for dir in "${!sizes[@]}"; do
            size=${sizes[$dir]}
            mkdir -p android/app/src/main/res/$dir
            convert icon.png -resize ${size}x${size} \
              android/app/src/main/res/$dir/ic_launcher.png
            convert icon.png -resize ${size}x${size} \
              android/app/src/main/res/$dir/ic_launcher_round.png
          done

          # حذف Adaptive Icons حتى يستخدم Android ملفات PNG مباشرة
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/
          rm -f  android/app/src/main/res/drawable/ic_launcher_foreground.xml
          rm -f  android/app/src/main/res/drawable/ic_launcher_background.xml

          echo "✓ Icons done"
          ls android/app/src/main/res/mipmap-xxhdpi/

      # ── رقم الإصدار ───────────────────────────────────────────
      - name: Set version
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.${VERSION_CODE}"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "▶ $VERSION_NAME ($VERSION_CODE)"

      # ── targetSdk 36 ─────────────────────────────────────────
      - name: Set API 36
        run: |
          sed -i "s/compileSdk .*/compileSdk 36/" android/app/build.gradle
          sed -i "s/targetSdk .*/targetSdk 36/"   android/app/build.gradle
          grep -E "compileSdk|targetSdk|versionCode|versionName" android/app/build.gradle

      # ── Gradle ────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Nile-v${{ env.VERSION_NAME }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release ───────────────────────────────────────────────
      - name: Check signing secrets
        id: secrets
        env:
          KB: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KB" ] && echo "available=true" >> $GITHUB_OUTPUT \
                       || echo "available=false" >> $GITHUB_OUTPUT

      - name: Build Release AAB
        if: steps.secrets.outputs.available == 'true'
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Sign Release AAB
        if: steps.secrets.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:  ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          rm -f release.keystore

      - name: Upload Release AAB
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Nile-v${{ env.VERSION_NAME }}-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Summary
        run: |
          SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "## ✅ AI Nile v${{ env.VERSION_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "| APK | $SIZE | targetSdk 36 |" >> $GITHUB_STEP_SUMMARY

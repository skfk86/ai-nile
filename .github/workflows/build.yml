name: Build AI Nile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install packages
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp icon.png www/icon.png

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      # ── AdMob: أضف App ID في AndroidManifest ────────────────
      - name: Inject AdMob App ID
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          # استخدم الـ ID الحقيقي من Secrets، أو Test ID كافتراضي
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # أضف meta-data قبل </application>
          sed -i "s|</application>|    <meta-data\n            android:name=\"com.google.android.gms.ads.APPLICATION_ID\"\n            android:value=\"${APP_ID}\"/>\n    </application>|" "$MANIFEST"
          echo "✓ AdMob App ID injected: $APP_ID"

      # ── أيقونة التطبيق ────────────────────────────────────────
      - name: Generate app icons
        run: |
          sudo apt-get install -y imagemagick

          # إنشاء نسخة بدون شفافية
          convert icon.png -background "#0d1464" -alpha remove -alpha off icon_full.png

          # حذف الأيقونات الافتراضية (Capacitor 6 يستخدم WEBP)
          find android/app/src/main/res -name "ic_launcher*" -delete
          find android/app/src/main/res -name "*.webp" -delete
          echo "✓ Default icons removed"

          # توليد PNG لكل الأحجام
          for entry in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            dir="${entry%%:*}"
            size="${entry##*:}"
            mkdir -p "android/app/src/main/res/$dir"
            convert icon_full.png -resize "${size}x${size}" "android/app/src/main/res/$dir/ic_launcher.png"
            convert icon_full.png -resize "${size}x${size}" "android/app/src/main/res/$dir/ic_launcher_round.png"
            echo "  ✓ $dir: ${size}px"
          done

          # Foreground للـ Adaptive Icon
          mkdir -p android/app/src/main/res/drawable
          convert icon_full.png -resize 432x432 android/app/src/main/res/drawable/ic_launcher_foreground.png

          # Background XML
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0d1464</color>\n</resources>\n' \
            > android/app/src/main/res/values/ic_launcher_background.xml

          # Adaptive Icon XML
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n</adaptive-icon>\n' \
            > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "✓ Icons done"
          ls android/app/src/main/res/mipmap-xxhdpi/

      # ── رقم الإصدار التلقائي ──────────────────────────────────
      - name: Set version
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.${VERSION_CODE}"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "▶ $VERSION_NAME ($VERSION_CODE)"

      # ── targetSdk 36 ─────────────────────────────────────────
      - name: Set API levels
        run: |
          sed -i "s/compileSdk .*/compileSdk 36/"       android/app/build.gradle
          sed -i "s/targetSdk .*/targetSdk 36/"         android/app/build.gradle
          sed -i "s/minSdk .*/minSdk 24/"               android/app/build.gradle
          sed -i "s/minSdkVersion .*/minSdkVersion 24/" android/app/build.gradle
          grep -E "compileSdk|targetSdk|minSdk|versionCode|versionName" android/app/build.gradle
          echo "▶ minSdk=24 targetSdk=36 compileSdk=36"

      # ── Gradle cache ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-

      # ── Debug APK (دائماً) ────────────────────────────────────
      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Nile-v${{ env.VERSION_NAME }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release AAB (يحتاج Secrets) ───────────────────────────
      - name: Check signing secrets
        id: secrets
        env:
          KB: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KB" ]; then
            echo "available=true"  >> $GITHUB_OUTPUT
            echo "▶ Keystore found — will build signed release"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "▶ No keystore — skipping release build"
            echo "  لإضافة التوقيع: شغّل workflow (Generate Keystore) أولاً"
          fi

      - name: Build Release AAB
        if: steps.secrets.outputs.available == 'true'
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Sign Release AAB
        if: steps.secrets.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:  ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          # التوقيع
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"

          # التحقق من التوقيع
          jarsigner -verify \
            -keystore release.keystore \
            android/app/build/outputs/bundle/release/app-release.aab \
            && echo "✓ Signature verified"

          rm -f release.keystore

      - name: Upload Signed Release AAB
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Nile-v${{ env.VERSION_NAME }}-release-SIGNED
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      # ── ملخص البناء ───────────────────────────────────────────
      - name: Summary
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(du -sh "$APK" | cut -f1)
          SIGNED="${{ steps.secrets.outputs.available }}"
          echo "## ✅ AI Nile v${{ env.VERSION_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| الحقل | القيمة |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| versionName | \`${{ env.VERSION_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| versionCode | \`${{ env.VERSION_CODE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| targetSdk   | \`36\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APK   | ✅ $SIZE |" >> $GITHUB_STEP_SUMMARY
          if [ "$SIGNED" = "true" ]; then
            echo "| Release AAB | ✅ موقَّع وجاهز للرفع |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Release AAB | ⏭️ شغّل Generate Keystore أولاً |" >> $GITHUB_STEP_SUMMARY
          fi

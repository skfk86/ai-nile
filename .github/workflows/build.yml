name: Build AI Nile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install packages
        run: npm install

      # ── www folder ────────────────────────────────────────────
      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      # ── أيقونة التطبيق (الطريقة الرسمية) ─────────────────────
      - name: Generate app icons
        run: |
          mkdir -p assets
          # نسخ الأيقونة وإنشاء الأحجام المطلوبة
          cp icon.png assets/icon.png
          cp icon.png assets/icon-foreground.png
          # توليد جميع أحجام الأيقونة لـ Android بما فيها Adaptive Icons
          npx @capacitor/assets generate \
            --assetPath assets \
            --androidProject android \
            --ios false
          echo "✓ Icons generated"
          ls android/app/src/main/res/mipmap-xxhdpi/

      # ── رقم الإصدار التلقائي ──────────────────────────────────
      - name: Set version
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.${VERSION_CODE}"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "▶ version $VERSION_NAME ($VERSION_CODE)"

      # ── targetSdk 36 ─────────────────────────────────────────
      - name: Set API level 36
        run: |
          sed -i "s/compileSdk .*/compileSdk 36/"  android/app/build.gradle
          sed -i "s/targetSdk .*/targetSdk 36/"    android/app/build.gradle
          grep -E "compileSdk|targetSdk|versionCode|versionName" android/app/build.gradle

      # ── Gradle ────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Nile-v${{ env.VERSION_NAME }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release ───────────────────────────────────────────────
      - name: Check signing secrets
        id: secrets
        env:
          KB: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KB" ] && echo "available=true" >> $GITHUB_OUTPUT \
                       || echo "available=false" >> $GITHUB_OUTPUT

      - name: Build Release AAB
        if: steps.secrets.outputs.available == 'true'
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Sign Release AAB
        if: steps.secrets.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:  ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"
          rm -f release.keystore

      - name: Upload Release AAB
        if: steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Nile-v${{ env.VERSION_NAME }}-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Summary
        run: |
          echo "## ✅ AI Nile v${{ env.VERSION_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| versionCode | \`${{ env.VERSION_CODE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| targetSdk   | \`36\` |" >> $GITHUB_STEP_SUMMARY
          SIZE=$(du -sh android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "| APK Size    | $SIZE |" >> $GITHUB_STEP_SUMMARY

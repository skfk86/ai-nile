name: 🔑 Generate Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'اسم المفتاح (مثال: ainile)'
        required: true
        default: 'ainile'
      store_password:
        description: 'كلمة مرور الـ Keystore'
        required: true
      key_password:
        description: 'كلمة مرور المفتاح'
        required: true
      developer_name:
        description: 'اسمك (للشهادة)'
        required: true
        default: 'Ali AlQasim'
      organization:
        description: 'المنظمة أو الشركة'
        required: false
        default: 'AI Nile'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore ainile.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=${{ inputs.developer_name }}, O=${{ inputs.organization }}, C=SD"
          echo "✓ Keystore generated"

      - name: Export as Base64
        run: |
          base64 ainile.keystore | tr -d '\n' > keystore_base64.txt
          echo ""
          echo "══════════════════════════════════════════"
          echo "أضف هذه الـ Secrets في GitHub:"
          echo "Settings → Secrets → Actions → New secret"
          echo "══════════════════════════════════════════"
          echo ""
          echo "Secret 1 — KEYSTORE_BASE64:"
          cat keystore_base64.txt
          echo ""
          echo ""
          echo "Secret 2 — KEY_ALIAS:"
          echo "${{ inputs.key_alias }}"
          echo ""
          echo "Secret 3 — KEY_PASSWORD:"
          echo "${{ inputs.key_password }}"
          echo ""
          echo "Secret 4 — STORE_PASSWORD:"
          echo "${{ inputs.store_password }}"
          echo ""
          echo "══════════════════════════════════════════"

      - name: Upload Keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: ainile-keystore-BACKUP
          path: ainile.keystore
          retention-days: 1

      - name: Upload Base64
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore_base64.txt
          retention-days: 1
